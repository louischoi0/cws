# KDS instance for the issues server. See ckdbs/kds.conf.sample for every
# key's meaning; only overrides from the built-in defaults are listed here.

data_file = /home/ubuntu/cws/kds-data/kds.db
log_dir   = /home/ubuntu/cws/kds-data
log_file  = kds.log
log_level = info
port      = 15432

# Pinned into the superblock on first boot: every varchar column gets this
# many bytes inline. There is no var-heap yet (README, "What KDS is not"),
# so a value that doesn't fit in one cell is refused outright, and every
# heap row must also fit in one 8192-byte page (8115 usable bytes).
#
# `issues` has 4 varchar columns (version/state/category/body) plus an
# int64 pk, so row size is ~4*inline_cell_width + 8 — empirically the
# engine refuses CREATE TABLE above width 2026 for this exact schema
# ("row size N exceeds the 8115 bytes a heap page can hold"). 2000 leaves
# margin below that ceiling for the base64-encoded markdown body (see
# server/main.go's maxTextBytes).
inline_cell_width = 2000
