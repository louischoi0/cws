# KDS instance for the issues server. See ckdbs/kds.conf.sample for every
# key's meaning; only overrides from the built-in defaults are listed here.

data_file = /home/ubuntu/cws/kds-data/kds.db
log_dir   = /home/ubuntu/cws/kds-data
log_file  = kds.log
log_level = info
# Deliberately NOT KDS's default 15432. That port, and the whole
# 15433/15460-15700 range around it, is what ckdbs' own tools and
# benchmark drivers use — several were found running on this machine —
# so a shared default is a collision waiting to happen, and the failure
# is quiet: kds_server exits with "bind() failed" while whatever already
# owns the port keeps answering, so this project's server would appear
# to work while reading someone else's database.
#
# 19432 was picked by checking it appears nowhere in the ckdbs tree
# (18432 and 17432 both do, in archived bench invocations). Changing it
# means changing three places together: this key, the KDS_ADDR default
# in server/main.go, and README's table.
port      = 19432

# Pinned into the superblock on first boot: every varchar column gets this
# many bytes inline. There is no var-heap yet (README, "What KDS is not"),
# so a value that doesn't fit in one cell is refused outright, and every
# heap row must also fit in one 8192-byte page (8115 usable bytes).
#
# `issues` has 5 varchar columns (project/version/state/category/body)
# plus an int64 pk, so row size is ~5*inline_cell_width + 8 —
# empirically the engine refuses CREATE TABLE above width 1621 for this
# exact schema ("row size N exceeds the 8115 bytes a heap page can
# hold"). 1600 leaves margin below that ceiling for the base64-encoded
# markdown body (see server/main.go's maxTextBytes).
inline_cell_width = 1600
